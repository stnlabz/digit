name: Slack Bridge qualification

on:
  push:
    paths:
      - "integrations/slack/**"
      - ".github/workflows/slack-bridge.yml"
  pull_request:
    paths:
      - "integrations/slack/**"
      - ".github/workflows/slack-bridge.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: python -m pip install -r integrations/slack/requirements.txt
      - name: Compile bridge sources
        run: python -m compileall -q integrations/slack
      - name: Run offline regression tests
        working-directory: integrations/slack
        run: python -m unittest -v test_bridge.py
